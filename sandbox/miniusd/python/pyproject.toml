[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miniusd"
version = "0.1.0"
description = "Mini USD: pure-python USDA/USDC/USDZ reader and writer (experimental)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]

[project.scripts]
miniusd = "miniusd.cli:main"

[tool.setuptools]
packages = ["miniusd"]
