# Simple workflow that builds wasm and publish to npm registry
name: Build and publish wasm

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'NPM Release Version'
        required: true
        type: string
        default: 1.0.0
      npm_tag:
        description: 'NPM Tag'
        required: true
        type: string
        default: preview

jobs:
  lightusd-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/npm/package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - name: Setup npm for staged publishing
        run: npm install --global npm@11.15.0
      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk

          ./emsdk install 7.0.0
          ./emsdk activate 7.0.0

          # Revert to 3.1.51 if there is a problem.
          ## from https://github.com/Twinklebear/webgpu-cpp-usdz/blob/main/.github/workflows/deploy-page.yml
          ## TODO: 3.1.52 has a change to WebGPU API that is incompatible
          ## with the C++ bindings I have in the repo?
          #./emsdk install 3.1.51
          #./emsdk activate 3.1.51
      # The npm package ships the core product: lightusd[_64] plus
      # its feature modules (geometry, raytrace, validator, exr) and the MCP
      # server module. Keep this list in sync with web/npm/build-wasm.sh and
      # web/npm/scripts/stage-package.mjs.
      - name: Build WASM (core + mcp, wasm32 + wasm64)
        run: |
          source ./emsdk/emsdk_env.sh
          build() {
            emcmake cmake -S web -B "web/$1" -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel "${@:2}"
            cmake --build "web/$1" --parallel
          }
          build cmake-build-core    -DLIGHTUSD_WASM_PRODUCT=core
          build cmake-build-core64  -DLIGHTUSD_WASM_PRODUCT=core -DLIGHTUSD_WASM64=1
          build cmake-build-mcp     -DLIGHTUSD_WASM_PRODUCT=mcp
          build cmake-build-mcp64   -DLIGHTUSD_WASM_PRODUCT=mcp -DLIGHTUSD_WASM64=1

      - name: Install npm dependencies
        working-directory: ${{ github.workspace }}/web/npm
        run: |
          npm ci

      - name: Stage npm package
        working-directory: ${{ github.workspace }}/web/npm
        run: |
          npm run build:stage -- --release-version=${{ github.event.inputs.release_version }}

      - name: Validate npm package
        working-directory: ${{ github.workspace }}/web/npm
        run: |
          npm run validate

      # Loads the tests/usda corpus through the staged package.
      - name: Test npm package
        working-directory: ${{ github.workspace }}/web/npm
        run: |
          npm run test:usda

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 'lightusd-npm-${{ github.event.inputs.release_version }}'
          path: ${{ github.workspace }}/web/npm/dist

      - name: Stage package for publishing
        working-directory: ${{ github.workspace }}/web/npm/dist
        run: |
          npm stage publish --provenance --access public --tag ${{ github.event.inputs.npm_tag }}
