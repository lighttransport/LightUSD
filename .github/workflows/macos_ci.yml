name: macOS

# TODO: Build with Python.

on:
  # Allows manual build verification on any branch/tag (e.g. physics-2026)
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:

  # Build with the experimental `next` (pcp large-scene) backend enabled.
  # src/next/ is gated behind LIGHTUSD_USE_NEXT_PCP_LARGE_SCENE and is not built
  # by the default macOS job, so this variant keeps it from bit-rotting.
  build-next-macos:

    runs-on: macos-latest
    name: Build for macOS (next backend)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: CmakeAndBuild
        run: |
            cmake -B build_next -S . \
              -DLIGHTUSD_NATIVE_PRODUCT=legacy \
              -DCMAKE_BUILD_TYPE=Release \
              -DLIGHTUSD_USE_NEXT_PCP_LARGE_SCENE=On \
              -DLIGHTUSD_WITH_TYDRA=On \
              -DLIGHTUSD_BUILD_TOOLS=On \
              -DLIGHTUSD_BUILD_EXAMPLES=On \
              -DLIGHTUSD_BUILD_TESTS=On
            cmake --build build_next
      - name: Ctest
        run: cd build_next && ctest --output-on-failure

  build-macos:

    runs-on: macos-latest
    name: Build for macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: CmakeAndBuild
        run: |
            ./scripts/bootstrap-cmake-macos.sh
            cd build
            make VERBOSE=1
      - name: Ctest
        run: |
            cd build
            ctest --output-on-failure

      # Test with OpenUSD binary (macOS ARM64)
      - name: Download OpenUSD binary (macOS ARM64)
        run: |
          gh release download v25.11-lte \
            --repo lighttransport/openusd-bin \
            --pattern 'openusd-*-minsizerel-macos-arm64.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Extract and setup OpenUSD (macOS ARM64)
        run: |
          mkdir -p openusd
          tar -xzf openusd-*-minsizerel-macos-arm64.tar.gz -C openusd
          USD_ROOT="$(pwd)/openusd"
          echo "USD_INSTALL_ROOT=$USD_ROOT" >> $GITHUB_ENV
          echo "$USD_ROOT/bin" >> $GITHUB_PATH
          echo "DYLD_LIBRARY_PATH=$USD_ROOT/lib:$USD_ROOT/tbb/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PYTHONPATH=$USD_ROOT/lib/python:$PYTHONPATH" >> $GITHUB_ENV
          echo "PXR_PLUGINPATH_NAME=$USD_ROOT/lib/usd" >> $GITHUB_ENV

      - name: Verify OpenUSD installation (macOS ARM64)
        run: |
          usdcat --help
          echo "OpenUSD binary: $(which usdcat)"

      - name: Test LightUSD and OpenUSD interoperability (macOS ARM64)
        run: |
          echo "=== Testing LightUSD <-> OpenUSD interoperability on macOS ARM64 ==="

          # Test 1: Read files with both tools
          for usd_file in models/suzanne.usdc models/cube.usda; do
            if [ -f "$usd_file" ]; then
              echo "Testing $usd_file"
              ./build/lusdcat "$usd_file" > /tmp/lusdcat.txt
              usdcat "$usd_file" > /tmp/usdcat.txt
              echo "✓ Both tools read $usd_file"
            fi
          done

          # Test 2: Convert with LightUSD, verify with OpenUSD
          if [ -f "models/suzanne.usdc" ]; then
            ./build/lusdcat models/suzanne.usdc > /tmp/lightusd.usda
            usdcat /tmp/lightusd.usda > /dev/null
            echo "✓ OpenUSD read LightUSD-generated USDA"
          fi

          echo "All macOS ARM64 tests passed!"
