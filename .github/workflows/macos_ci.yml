name: macOS

# TODO: Build with Python.

on:
  # Allows manual build verification on any branch/tag (e.g. physics-2026)
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

# ccache (installed and persisted per job by hendrikmuhs/ccache-action; the
# root CMakeLists picks it up as the compiler launcher).
env:
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_COMPRESS: "true"

jobs:

  # Build with the experimental `next` (pcp large-scene) backend enabled.
  # src/next/ is gated behind LIGHTUSD_USE_NEXT_PCP_LARGE_SCENE and is not built
  # by the default macOS job, so this variant keeps it from bit-rotting.
  build-next-macos:

    runs-on: macos-latest
    name: Build for macOS (next backend)

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-legacy-with-next
          max-size: 500M
      - name: CmakeAndBuild
        run: |
            cmake -B build_next -S . \
              -DLIGHTUSD_NATIVE_PRODUCT=legacy \
              -DCMAKE_BUILD_TYPE=Release \
              -DLIGHTUSD_USE_NEXT_PCP_LARGE_SCENE=On \
              -DLIGHTUSD_WITH_TYDRA=On \
              -DLIGHTUSD_BUILD_TOOLS=On \
              -DLIGHTUSD_BUILD_EXAMPLES=On \
              -DLIGHTUSD_BUILD_TESTS=On
            cmake --build build_next -j $(sysctl -n hw.ncpu)
      - name: Ctest
        run: cd build_next && ctest --output-on-failure

