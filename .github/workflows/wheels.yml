name: Build wheels

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to build (optional; defaults to branch tip)"
        required: false
        type: string

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     arch: x86_64 }
          - { os: ubuntu-24.04-arm,  arch: aarch64 }
          - { os: macos-14,          arch: arm64 }
          - { os: windows-latest,    arch: AMD64 }
          - { os: windows-11-arm,    arch: ARM64 }

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.ref }}
          submodules: recursive
          fetch-depth: 0   # setuptools_scm

      - name: Build wheels
        # v3.x is required for cp314t (free-threaded) targets; the build
        # matrix (cp311-abi3 + cp314t) comes from [tool.cibuildwheel] in
        # pyproject.toml.
        uses: pypa/cibuildwheel@v3.2
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Publish both final and pre-release tags. setuptools_scm normalizes tags
    # such as v1.0.0-rc4 to the PEP 440 version 1.0.0rc4 for PyPI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # Uses PyPI Trusted Publishing (OIDC). No API token is configured — the
    # GitHub-issued OIDC token is exchanged for a short-lived upload token by
    # PyPI. The pypi.org project must have a matching publisher registered:
    #   owner:    lighttransport
    #   repo:     LightUSD
    #   workflow: wheels.yml
    #   env:      pypi
    environment:
      name: pypi
      url: https://pypi.org/p/lightusd
    permissions:
      id-token: write   # mint OIDC token for PyPI
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No `password` / `user` — forces the action to use the OIDC
          # trusted-publisher flow. Attestations emit PEP 740 provenance
          # records for each uploaded file.
          attestations: true
          print-hash: true
