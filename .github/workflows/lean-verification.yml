name: Lean verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'verif/lean/**'
      - 'src/next/**'
      - 'src/spline-eval.hh'
      - 'src/unicode-xid*'
      - 'tests/next/**'
      - 'scripts/*lean*'
      - '.github/workflows/lean-verification.yml'
  push:
    branches: [main]
    paths:
      - 'verif/lean/**'
      - 'src/next/**'
      - 'src/spline-eval.hh'
      - 'src/unicode-xid*'
      - 'tests/next/**'
      - 'scripts/*lean*'
      - '.github/workflows/lean-verification.yml'

permissions:
  contents: read

jobs:
  proofs-and-reflection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stock OpenUSD oracle
        run: python3 -m pip install --target build_ninja/stock-oracle --no-deps 'usd-core==26.11'
      - name: Cache hash-pinned Unicode reference data
        uses: actions/cache@v4
        with:
          path: build_ninja/unicode-15.1.0
          key: unicode-${{ hashFiles('verif/lean/data/unicode-15.1.0.json') }}
      - name: Verify independent Unicode table provenance
        run: |
          python3 scripts/fetch-lean-unicode-data.py
          python3 scripts/test-lean-unicode-data.py
      - name: Cache pinned Lean dependencies
        uses: actions/cache@v4
        with:
          path: verif/lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verif/lean/lean-toolchain', 'verif/lean/lake-manifest.json', 'verif/lean/lakefile.toml') }}
      - name: Fetch Mathlib compiled dependencies
        working-directory: verif/lean
        run: lake exe cache get
      - name: Build all proofs
        working-directory: verif/lean
        run: lake build
      - name: Audit all theorem axioms
        working-directory: verif/lean
        run: lake env lean Audit/Axioms.lean
      - name: Official Unicode normalization conformance
        run: python3 scripts/test-lean-unicode-data.py --conformance
      - name: Axiom audit regression tests
        run: python3 scripts/test-lean-axioms.py
      - name: Runtime and committed-vector drift
        working-directory: verif/lean
        run: |
          lake exe usdspec-test
          lake exe usdspec-gen --out ../../tests/next/generated/lean --check
      - name: Issue and exact declaration registries
        run: |
          bash scripts/check-lean-issues.sh
          python3 scripts/check-lean-spec-citations.py --max-unverified 0
          python3 scripts/check-lean-model-split.py
          python3 scripts/test-check-lean-reflection.py
          python3 scripts/check-lean-reflection.py --check --lake
      - name: Configure Debug core and checker
        run: |
          cmake -S . -B build_ninja/lean-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DLIGHTUSD_NATIVE_PRODUCT=next \
            -DLIGHTUSD_BUILD_TESTS=ON -DLIGHTUSD_BUILD_TOOLS=ON \
            -DLIGHTUSD_NEXT_BUILD_TESTS=ON
      - name: Build production vector consumers and checker
        run: cmake --build build_ninja/lean-ci --parallel 4 --target test_lean_vectors test_name_order test_int64_listop lusdchecker lusdcat
      - name: Validate vectors and exported rule metadata
        run: |
          ctest --test-dir build_ninja/lean-ci -R '^next_test_lean_vectors$' --output-on-failure
          python3 scripts/check-lean-reflection.py --check --lake \
            --lusdchecker build_ninja/lean-ci/lusdchecker --require-lusdchecker
      - name: Non-canonical crate list-op modes against stock OpenUSD
        run: |
          python3 tests/next/test-listop-modes.py --tool build_ninja/lean-ci/test_int64_listop \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Lean prim-index arc edits and payload loading against stock OpenUSD
        run: |
          python3 tests/next/test-prim-index-vectors.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Lean terminating sublayer traversal against stock OpenUSD
        run: |
          python3 tests/next/test-layer-stack-vectors.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Dictionary and stage ordering against stock OpenUSD
        run: |
          build_ninja/lean-ci/test_name_order
          python3 tests/next/test-name-order.py --tool build_ninja/lean-ci/test_name_order \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Local unregistered metadata folding against stock OpenUSD
        run: |
          python3 tests/next/test-raw-metadata.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Lean quoted strings against stock OpenUSD
        run: |
          python3 tests/next/test-usda-strings.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Lean dictionary keys against stock OpenUSD
        run: |
          python3 tests/next/test-usda-keys.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
      - name: Lossless PCP JSON contract against stock OpenUSD
        run: |
          python3 tests/next/test-pcp-json.py --lusdcat build_ninja/lean-ci/lusdcat \
            --oracle-python "$(command -v python3)" \
            --oracle-pythonpath build_ninja/stock-oracle
