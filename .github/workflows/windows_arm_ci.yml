name: Windows ARM

# TODO: Run unittest on Native ARM64 Windows11

on:
  # Allows manual build verification on any branch/tag (e.g. physics-2026)
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:

  # Windows(ARM64) + Visual Studio 2026 build
  build-windows-arm64-msvc:

    runs-on: windows-latest
    name: Build for Windows(ARM64, MSVC)

    # Use system installed cmake
    # https://help.github.com/en/actions/reference/software-installed-on-github-hosted-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure
        run: |
          mkdir build_arm64
          cmake -G "Visual Studio 18 2026" -A ARM64 -Bbuild_arm64 -DLIGHTUSD_NATIVE_PRODUCT=legacy -DLIGHTUSD_WITH_EXR=1 -DLIGHTUSD_WITH_TIFF=1 -S.
      - name: Build
        run: cmake --build build_arm64 --config Release

