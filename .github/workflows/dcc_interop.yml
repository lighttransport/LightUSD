name: DCC interoperability

on:
  workflow_dispatch:
    inputs:
      blender_executable:
        description: Absolute Blender 5.2+ executable path on the Linux runner
        required: true
        default: /home/runner/local/blender-5.2.0-linux-x64/blender
      ue_editor:
        description: Absolute UnrealEditor-Cmd.exe path on the Windows runner
        required: true
        default: C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe
      ue_project:
        description: Absolute .uproject path on the Windows runner
        required: true
        default: D:\work\LightUSDTest\LightUSDTest.uproject

jobs:
  asset-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test streamed asset transport
        run: python3 -m unittest dcc.bridge.tests.test_asset_bridge -v

  blender-5-2:
    runs-on: [self-hosted, linux, lightusd-blender-5.2]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Run Blender interchange regressions
        env:
          BLENDER: ${{ inputs.blender_executable }}
        run: >-
          python3 dcc/run_interop_regressions.py
          --report "$RUNNER_TEMP/lightusd-blender-report.json"
          --timeout 900
      - name: Upload Blender report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lightusd-blender-5.2-report
          path: ${{ runner.temp }}/lightusd-blender-report.json
          if-no-files-found: error

  ue-5-8:
    runs-on: [self-hosted, windows, lightusd-ue-5.8]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Run UE interchange regressions
        shell: powershell
        run: |
          & .\dcc\ue\tests\run_headless_regressions.ps1 `
            -Editor '${{ inputs.ue_editor }}' `
            -Project '${{ inputs.ue_project }}' `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -OutRoot "$env:RUNNER_TEMP\lightusd-ue-regressions"
      - name: Upload UE reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lightusd-ue-5.8-reports
          path: ${{ runner.temp }}\lightusd-ue-regressions
          if-no-files-found: error
