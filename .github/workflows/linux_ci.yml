  # 32bit build(Linux only)
  build-32bit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: setup
      run: |
          sudo apt update
          # gcc-multilib gives us 32-bit libstdc++ and toolchain bits, but
          # NOT the 32-bit ASan runtime — lib32asan8 must be installed
          # explicitly. Without it, -m32 -fsanitize=address compiles
          # cleanly but the link fails with undefined references to
          # __asan_report_* . We compile with gcc here — Ubuntu does not
          # ship a multiarch i386 build of libclang-rt-XX-dev, so clang's
          # -fsanitize=address has no i386 runtime to link against.
          sudo apt-get install -y gcc-multilib g++-multilib lib32asan8
    - name: configure
      run: ./scripts/bootstrap-cmake-linux-32bit.sh
    - name: make
      run: cd build_m32 && make
    - name: test
      run: cd build_m32 && ctest --output-on-failure

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    # ubuntu-latest(Ubuntu 22.04 as of 2024/01/03) has clang installed,
    # so use clang
    # TODO: Use libc++ for STL?
    - name: configure
      run: CXX=clang++ CC=clang ./scripts/bootstrap-cmake-linux.sh
    - name: make
      run: cmake --build build
    - name: tests
      run: cd build && ctest --output-on-failure

    # Test with OpenUSD binary
    - name: Install TBB dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y libtbb12

    - name: Download OpenUSD binary
      run: |
        gh release download v25.11-lte \
          --repo lighttransport/openusd-bin \
          --pattern 'openusd-*-minsizerel-linux-x86_64.tar.gz'
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Extract and setup OpenUSD
      run: |
        mkdir -p openusd
        tar -xzf openusd-*-minsizerel-linux-x86_64.tar.gz -C openusd
        USD_ROOT="$(pwd)/openusd"
        echo "USD_INSTALL_ROOT=$USD_ROOT" >> $GITHUB_ENV
        echo "$USD_ROOT/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$USD_ROOT/lib:$USD_ROOT/tbb/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$USD_ROOT/lib/python:$PYTHONPATH" >> $GITHUB_ENV
        echo "PXR_PLUGINPATH_NAME=$USD_ROOT/lib/usd" >> $GITHUB_ENV

    - name: Verify OpenUSD installation
      run: |
        usdcat --help
        echo "OpenUSD binary: $(which usdcat)"

    - name: Test LightUSD and OpenUSD interoperability
      run: |
        echo "=== Testing LightUSD <-> OpenUSD interoperability ==="

        # Test 1: Read files with both tools
        for usd_file in models/suzanne.usdc models/cube.usda; do
          if [ -f "$usd_file" ]; then
            echo "Testing $usd_file"
            ./build/lusdcat "$usd_file" > /tmp/lusdcat.txt
            usdcat "$usd_file" > /tmp/usdcat.txt
            echo "✓ Both tools read $usd_file"
          fi
        done

        # Test 2: Convert with LightUSD, verify with OpenUSD
        if [ -f "models/suzanne.usdc" ]; then
          ./build/lusdcat models/suzanne.usdc > /tmp/lightusd.usda
          usdcat /tmp/lightusd.usda > /dev/null
          echo "✓ OpenUSD read LightUSD-generated USDA"
        fi

        echo "All tests passed!"

  # Build the optional MCP server + QuickJS configuration (both default OFF).
  # This config is not covered by the default build, so it can silently bit-rot
  # against core API changes; build + test it here to catch that early.
  build-mcp-qjs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: configure
      run: |
        CXX=clang++ CC=clang cmake -B build_mcp -S . \
          -DLIGHTUSD_NATIVE_PRODUCT=legacy \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIGHTUSD_WITH_MCP_SERVER=On \
          -DLIGHTUSD_WITH_QJS=On \
          -DLIGHTUSD_WITH_TYDRA=On \
          -DLIGHTUSD_BUILD_TOOLS=On \
          -DLIGHTUSD_BUILD_EXAMPLES=On \
          -DLIGHTUSD_BUILD_TESTS=On
    - name: make
      run: cmake --build build_mcp -j2
    - name: tests
      run: cd build_mcp && ctest --output-on-failure

  # Default product: the root configure builds the next implementation
  # (LIGHTUSD_NATIVE_PRODUCT defaults to next). The legacy jobs pin
  # -DLIGHTUSD_NATIVE_PRODUCT=legacy explicitly.
  build-next-product:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: configure
      run: |
        CXX=clang++ CC=clang cmake -B build_next_product -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIGHTUSD_WITH_TYDRA=On \
          -DLIGHTUSD_BUILD_EXAMPLES=On \
          -DLIGHTUSD_BUILD_TESTS=On
    - name: make
      run: cmake --build build_next_product -j2
    - name: tests
      run: cd build_next_product && ctest --output-on-failure

  # Build and run the lusdview unit tests (no GPU required). These compiled
  # unit tests validate lighting, texture, material, geometry, and camera
  # extraction. The viewer itself is not built by the target list below.
  build-lusdview-hermetic:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: install configure dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
          libxinerama-dev libxcursor-dev libxi-dev
    - name: configure
      run: |
        CXX=clang++ CC=clang cmake -B build_lusdview -S . -G Ninja \
          -DLIGHTUSD_NATIVE_PRODUCT=legacy \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIGHTUSD_WITH_TYDRA=On \
          -DLIGHTUSD_BUILD_EXAMPLES=On \
          -DLIGHTUSD_BUILD_TESTS=On \
          -DLIGHTUSD_BUILD_GUI_VIEWER=On
    - name: build tests
      run: |
        cmake --build build_lusdview -j2 \
          --target lusdview_lighting_test \
          --target lusdview_lightrt_bridge_test \
          --target lusdview_openpbr_material_test \
          --target lusdview_texture_pipeline_test \
          --target lusdview_lightrt_mtlx_eval_test \
          --target lusdview_lightrt_mtlx_graph_connection_test \
          --target lusdview_lightrt_mtlx_graph_evaluation_test \
          --target lusdview_geometry_primvar_test \
          --target lusdview_camera_nav_test
    - name: tests
      run: |
        cd build_lusdview && ctest --output-on-failure -R "lusdview_lighting|lusdview_lightrt_bridge|lusdview_openpbr|lusdview_texture_pipeline|lusdview_lightrt_mtlx|lusdview_geometry|lusdview_camera_nav|lusdview-vk-oit-validation"

  # Build with the experimental `next` (pcp large-scene) backend enabled.
  # The default build and the rest of CI do NOT compile src/next/ — it is gated
  # behind LIGHTUSD_USE_NEXT_PCP_LARGE_SCENE — so this variant exists to keep the
  # next/ library + examples from silently bit-rotting against core API changes.
  build-next:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: configure
      run: |
        CXX=clang++ CC=clang cmake -B build_next -S . -G Ninja \
          -DLIGHTUSD_NATIVE_PRODUCT=legacy \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIGHTUSD_USE_NEXT_PCP_LARGE_SCENE=On \
          -DLIGHTUSD_WITH_TYDRA=On \
          -DLIGHTUSD_BUILD_TOOLS=On \
          -DLIGHTUSD_BUILD_EXAMPLES=On \
          -DLIGHTUSD_BUILD_TESTS=On
    - name: make
      run: cmake --build build_next
    - name: tests
      run: cd build_next && ctest --output-on-failure

  # AOUSD Core supplemental conformance (next + Python).
  # Fetches the pinned supplemental corpus (scripts/fetch-aousd-supplemental.sh)
  # and runs both the C++ next_aousd_* ctests and the Python
  # test_aousd_supplemental.py suite. Corpus is not vendored; fetch is cached
  # in ~/.cache/lightusd.
  build-aousd:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Fetch AOUSD supplemental
      run: |
        SUITE_ROOT=$(bash scripts/fetch-aousd-supplemental.sh)
        echo "AOUSD_CORE_SUPPLEMENTAL_ROOT=$SUITE_ROOT" >> $GITHUB_ENV
        echo "LIGHTUSD_AOUSD_SUPPLEMENTAL_ROOT=$SUITE_ROOT" >> $GITHUB_ENV
        # proper workspace symlink for discovery fallback (within $GITHUB_WORKSPACE, not ../)
        ln -sf "$SUITE_ROOT" ./aousd-supplemental
        ls -la "$SUITE_ROOT" | head -n 20
        echo "AOUSD supplemental at $SUITE_ROOT"
    - name: configure next with supplemental
      run: |
        echo "AOUSD_CORE_SUPPLEMENTAL_ROOT=$AOUSD_CORE_SUPPLEMENTAL_ROOT"
        CXX=clang++ CC=clang cmake -S src/next -B build_next_aousd -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIGHTUSD_NEXT_BUILD_TESTS=On \
          -DLIGHTUSD_AOUSD_SUPPLEMENTAL_ROOT="$AOUSD_CORE_SUPPLEMENTAL_ROOT" \
          -DLIGHTUSD_NEXT_ENABLE_THREAD=On
    - name: make next
      run: cmake --build build_next_aousd -j 4
    - name: ctest aousd
      run: ctest --test-dir build_next_aousd -R "aousd" --output-on-failure
    - name: Python aousd binding
      run: |
        python3 -m pip install -e . --no-build-isolation
        python3 -m pip install pytest numpy
        python3 -m pytest python/tests/test_aousd_supplemental.py -v
        python3 -m pytest python/tests -k "not large and not usd_assets" -q
      env:
        AOUSD_CORE_SUPPLEMENTAL_ROOT: ${{ env.AOUSD_CORE_SUPPLEMENTAL_ROOT }}
        LIGHTUSD_AOUSD_SUPPLEMENTAL_ROOT: ${{ env.LIGHTUSD_AOUSD_SUPPLEMENTAL_ROOT }}

  # ARM64 ASan build — disabled. Deprecated; re-enable when the asan
  # runtime setup on the ubuntu-24.04-arm runner is sorted out.
