name = "usdspec"
defaultTargets = ["UsdSpec"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "UsdSpec"

[[lean_lib]]
name = "Gen"

[[lean_lib]]
name = "Check"

[[lean_lib]]
name = "Test"

[[lean_exe]]
name = "usdspec-gen"
root = "Gen.Main"

[[lean_exe]]
name = "usdspec-check-corpus"
root = "Check.CombineChain"

[[lean_exe]]
name = "usdspec-test"
root = "Test.Main"
