[build-system]
requires = [
    "setuptools>=68",
    "setuptools_scm>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "lightusd"
dynamic = ["version"]
description = "Lightweight, dependency-free USD/USDA/USDC/USDZ loader + Tydra render-scene access, with NumPy-friendly zero-copy arrays (CPython abi3 + free-threaded wheels)."
readme = "python/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Syoyo Fujita", email = "syoyo@lighttransport.com" },
    { name = "Light Transport Entertainment, Inc.", email = "syoyo@lighttransport.com" },
]
keywords = ["usd", "usda", "usdc", "usdz", "pixar", "3d", "scene"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/lighttransport/LightUSD"
Repository = "https://github.com/lighttransport/LightUSD"
Issues = "https://github.com/lighttransport/LightUSD/issues"

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=2.2,<3"]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["lightusd"]

[tool.setuptools.package-data]
lightusd = ["py.typed", "*.pyi"]

[tool.setuptools_scm]
version_file = "python/lightusd/_version.py"

# --------------------------------------------------------------------------
# cibuildwheel configuration
# --------------------------------------------------------------------------
# Two wheels per platform:
#   cp311-abi3 : Py_LIMITED_API=0x030B0000, covers CPython >= 3.11
#   cp314t     : free-threaded CPython 3.14 (non-limited; Py_mod_gil declared)
[tool.cibuildwheel]
build = ["cp311-*", "cp314t-*"]
enable = ["cpython-freethreading"]
# No PyPy; lightusd is CPython-only.
skip = [
    "pp*",
    "*-musllinux*",
    "*-win32",
    "*-manylinux_i686",
]
build-frontend = "build"
archs = ["auto64"]
test-skip = ["*-win_arm64"]
test-command = "pytest {project}/python/tests -k \"not slow and not large and not usd_assets and not aousd\" -q"
test-extras = "test"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64:2025.10.10-1"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_28_aarch64:2025.10.10-1"
archs = ["x86_64", "aarch64"]
before-build = "yum install -y ninja-build || apt-get install -y ninja-build || true"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

# Free-threaded wheel: run the suite with the GIL forced off so a module
# that silently re-enables it (missing Py_mod_gil) fails loudly.
[[tool.cibuildwheel.overrides]]
select = "cp314t-*"
test-environment = { PYTHON_GIL = "0" }

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "large: marks tests requiring /mnt/disk1/data (alab/island/caldera)",
    "usd_assets: marks tests requiring USD assets corpus",
    "aousd: marks tests requiring AOUSD supplemental",
]
